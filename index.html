  <body>
    <!-- Critical inline styles for immediate render -->
    <style>
      *,*::before,*::after{box-sizing:border-box}
      body{font-family:'Outfit',ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;margin:0;line-height:1.5;-webkit-font-smoothing:antialiased;background:#f5f7fa}
      @media(prefers-color-scheme:dark){body{background:#171717}}
      #root{min-height:100vh;display:flex;flex-direction:column}
      .container{width:100%;margin-left:auto;margin-right:auto;padding-left:1rem;padding-right:1rem}
      @media(min-width:1024px){.container{max-width:1280px;padding-left:2rem;padding-right:2rem}}
      h1,h2,h3,p{margin:0}
      button{cursor:pointer}
      img{max-width:100%;height:auto}
      /* Inline skeleton for immediate FCP */
      .init-skeleton{position:fixed;inset:0;z-index:9999;background:#f5f7fa;display:flex;flex-direction:column}
      @media(prefers-color-scheme:dark){.init-skeleton{background:#171717}}
      .init-header{height:64px;border-bottom:1px solid #e5e7ef;display:flex;align-items:center;padding:0 16px;gap:8px;background:#ffffff}
      @media(prefers-color-scheme:dark){.init-header{border-color:#404040;background:#262626}}
      .init-logo{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,#f97316,#ea580c)}
      .init-text{width:80px;height:24px;background:#e5e7ef;border-radius:4px}
      @media(prefers-color-scheme:dark){.init-text{background:#404040}}
      .init-spacer{flex:1}
      .init-btn{width:100px;height:36px;background:#e8590c;border-radius:8px}
    </style>
    <div id="root">
      <!-- Inline skeleton for immediate First Contentful Paint -->
      <div id="initial-skeleton" class="init-skeleton">
        <header class="init-header">
          <div class="init-logo"></div>
          <div class="init-text"></div>
          <div class="init-spacer"></div>
          <div class="init-btn"></div>
        </header>
      </div>
    </div>
    <script>
      // Remove skeleton only when app signals successful mount
      (function() {
        var removed = false;
        function removeSkeleton() {
          if (removed) return;
          removed = true;
          var s = document.getElementById('initial-skeleton');
          if (s) {
            s.style.transition = 'opacity 200ms';
            s.style.opacity = '0';
            setTimeout(function() { if (s && s.parentNode) s.parentNode.removeChild(s); }, 220);
          }
        }
        window.addEventListener('app:mounted', removeSkeleton);
        // Safety net: if app never mounts in 15s, leave skeleton (fallback UI will replace #root contents)
        setTimeout(function() {
          var root = document.getElementById('root');
          // If root has been replaced with fallback or app, remove skeleton
          if (root && root.children.length > 1) removeSkeleton();
        }, 15000);
      })();
    </script>
